name: Publish editorial overrides

on:
  workflow_dispatch:        # manually triggered from the Actions tab after editor review
    inputs:
      sheet_id:
        description: "Optional staging Sheet ID. When set, reads/writes there and commits nothing."
        required: false
        default: ""

permissions:
  contents: write
  id-token: write           # required for Workload Identity Federation

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: github-actions-sheets@project-d5e32b84-d94f-446f-9b5.iam.gserviceaccount.com

      - name: Download FSA weekly closed-school search file
        run: python scripts/download_weekly_closed_school_search_file.py

      - name: Download WSF from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/wsf
          gh release download wsf-current \
            --pattern "schfile_access_format_*.zip" \
            --dir /tmp/wsf \
            --repo ${{ github.repository }}
          WSF_ZIP=$(ls /tmp/wsf/schfile_access_format_*.zip | head -1)
          WSF_DATE=$(basename "$WSF_ZIP" | grep -oP '\d{8}' | head -1)
          WSF_DATE_ISO="${WSF_DATE:0:4}-${WSF_DATE:4:2}-${WSF_DATE:6:2}"
          mkdir -p "data/raw/weekly_school_file/${WSF_DATE_ISO}/access"
          mv "$WSF_ZIP" "data/raw/weekly_school_file/${WSF_DATE_ISO}/access/"

      - name: Download IPEDS year-cache from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/ipeds-cache
          gh release download ipeds-cache-current \
            --pattern "ipeds_year_cache.zip" \
            --dir /tmp/ipeds-cache \
            --repo ${{ github.repository }}
          unzip -q /tmp/ipeds-cache/ipeds_year_cache.zip -d /tmp/ipeds-cache

      - name: Run parse and crosswalk
        run: |
          python scripts/parse_federal_sources.py
          python scripts/build_ipeds_crosswalk.py --year-cache-dir /tmp/ipeds-cache

      - name: Pull overrides from Google Sheet
        env:
          CLOSURE_LIST_SHEET_ID: ${{ inputs.sheet_id || secrets.CLOSURE_LIST_SHEET_ID }}
        run: |
          python scripts/pull_gsheet_overrides.py \
            --sheet "$CLOSURE_LIST_SHEET_ID" \
            --output data/manual/closure_type_overrides.csv

      - name: Re-run classifier with updated overrides
        run: python scripts/classify_closure_events.py

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Update Sheet published tab
        env:
          CLOSURE_LIST_SHEET_ID: ${{ inputs.sheet_id || secrets.CLOSURE_LIST_SHEET_ID }}
        run: |
          python scripts/push_to_gsheet.py \
            --sheet "$CLOSURE_LIST_SHEET_ID" --tab published

      - name: Commit overrides and push
        if: ${{ !inputs.sheet_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/manual/closure_type_overrides.csv
          git diff --cached --quiet || \
            git commit -m "chore: publish editorial overrides [skip ci]"
          git push
